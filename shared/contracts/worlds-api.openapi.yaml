openapi: 3.1.0
info:
  title: Wander worlds API
  version: 1.0.0
  description: |
    FastAPI service deployed on Modal. It is the only thing that touches the
    Modal Volume (`worlds/…`, `sessions/…`) and the only thing the phone and the
    web app talk to.

    * **Worlds** — manifests, splats, VPS maps, meshes, navigation graph and
      measurements, stored on the Volume (see `world.schema.json`).
    * **Navigation** — localization fixes from the Niantic Lightship SDK on the
      phone, routing over the graph, live session progress for the dashboard
      (see `navigation.schema.json`).

    Every request carries `X-API-Key`. The Next.js app proxies the `/worlds/…`
    routes at `/api/worlds/…` so the key never reaches the browser; the phone
    sends the key directly. Rendering happens in the browser, so this service
    runs on a CPU container — no GPU.

    Storage layout on the Volume:

        worlds/<id>/world.json           manifest (source of truth for the graph)
        worlds/<id>/notes.json           notes pinned in the web viewer
        worlds/<id>/measurements.json    measurements taken in the web viewer
        worlds/<id>/<version>/scene.spz  immutable versioned assets
        sessions/<sessionId>.json        navigation session state (or a Modal Dict)

servers:
  - url: https://{app}.modal.run
    variables:
      app: { default: wander-api }

security:
  - apiKey: []

tags:
  - name: worlds
  - name: assets
  - name: navigation
  - name: sessions

paths:
  /worlds:
    get:
      tags: [worlds]
      summary: List worlds
      description: Every readable `worlds/*/world.json`. Invalid manifests are skipped and logged.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [worlds]
                properties:
                  worlds:
                    type: array
                    items: { $ref: "world.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [worlds]
      summary: Create a world
      description: |
        Creates `worlds/<id>/world.json` with `status: draft`, `version: v1`,
        an identity `alignment`, and `assets.splat` pointing at
        `worlds/<id>/v1/<splatFilename>` (default `scene.spz`). Upload the
        file afterwards with `PUT /worlds/{id}/{version}/{filename}`, then
        `PATCH` the status. The web app does exactly this from its upload dialog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
                name: { type: string }
                space: { type: string }
                description: { type: string }
                nianticSiteId: { type: [string, "null"] }
                splatFilename:
                  type: string
                  default: scene.spz
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*\\.(spz|ply|splat|ksplat|sog)$"
                  description: Filename the manifest should point at under v1.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "world.schema.json" }
        "409": { description: A world with this id already exists }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    get:
      tags: [worlds]
      summary: Read a world manifest
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "world.schema.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [worlds]
      summary: Update manifest fields
      description: |
        Partial update. Only the listed fields may change here; the graph has
        its own endpoint. To switch to a newly uploaded splat send `version`
        together with `assets` (the web app sends
        `{ version: "v2", assets: { splat: "worlds/<id>/v2/scene.spz" }, status }`).
        Validate that referenced asset files exist. `updatedAt` is set by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                space: { type: string }
                description: { type: string }
                nianticSiteId: { type: [string, "null"] }
                version: { type: string, description: "Switch the active asset version (directory must exist)." }
                assets: { $ref: "world.schema.json#/properties/assets" }
                alignment: { $ref: "world.schema.json#/properties/alignment" }
                status: { $ref: "world.schema.json#/properties/status" }
                stats: { $ref: "world.schema.json#/properties/stats" }
      responses:
        "200":
          description: Updated manifest
          content:
            application/json:
              schema: { $ref: "world.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [worlds]
      summary: Delete a world and all of its versions
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/graph:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    put:
      tags: [worlds]
      summary: Replace the navigation graph
      parameters:
        - in: header
          name: If-Match
          required: false
          schema: { type: string }
          description: Proposal sourceRevision; rejects acceptance if the graph, mesh or alignment changed.
      description: |
        Written by the web viewer when stops are tagged. Replaces
        `navigationGraph` wholesale (validate node ids are unique and every
        edge references a node) and bumps `updatedAt`. Routing uses this graph
        immediately; no cache. An optional If-Match header must match the proposal sourceRevision; otherwise returns 412.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "world.schema.json#/properties/navigationGraph" }
      responses:
        "200":
          description: Updated manifest
          content:
            application/json:
              schema: { $ref: "world.schema.json" }
        "412":
          description: The proposal is stale; generate again before accepting
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/graph/validate:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    post:
      tags: [worlds]
      summary: Check a graph against the world's mesh
      description: |
        Read-only. Grids `assets.mesh` (see `meshFrame`) and reports edges that
        cross blocked cells (`edge-through-wall`), edges or nodes off the
        scanned floor, and nodes whose height is off the floor. Returns a copy
        of the graph with node heights snapped onto the floor (unless
        `snap: false`); the editor saves it with `PUT /graph` if accepted.
        Checks the stored graph when `graph` is omitted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                graph: { $ref: "world.schema.json#/properties/navigationGraph" }
                snap: { type: boolean, default: true }
                params: { $ref: "#/components/schemas/NavmeshParams" }
                frame: { type: string, enum: [world, splat] }
      responses:
        "200":
          description: Issues plus the snapped graph copy
          content:
            application/json:
              schema:
                type: object
                required: [issues, graph, floorY, checkedAt]
                properties:
                  issues: { type: array, items: { $ref: "#/components/schemas/GraphIssue" } }
                  graph: { $ref: "world.schema.json#/properties/navigationGraph" }
                  floorY: { type: number }
                  checkedAt: { type: string, format: date-time }
        "409": { description: World has no mesh asset or generation inputs changed }
        "422": { description: Bad parameters or no floor found }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/navmesh:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    get:
      tags: [worlds]
      summary: Last graph proposal generated from the mesh
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NavmeshProposal" }
        "404": { description: World not found or nothing generated yet }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [worlds]
      summary: Propose a navigation graph from the mesh
      description: |
        Occupancy grid over `assets.mesh` (floor detection, agent-radius
        erosion, largest connected component) → sparse walking graph. Named places
        retain their IDs and are connected only through verified free floor. Disconnected
        places and excluded floor area are reported. Multiple floors, vertical links
        and restricted paths require a manually authored graph. Deterministic for a
        given mesh, graph and `params`. Writes
        `worlds/<id>/navmesh.json` and returns it; `navigationGraph` is NOT
        touched — a reviewer accepts with `PUT /graph` and `If-Match: sourceRevision`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                params: { $ref: "#/components/schemas/NavmeshParams" }
                frame: { type: string, enum: [world, splat], description: Overrides the manifest's `meshFrame` }
      responses:
        "201":
          description: Stored proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NavmeshProposal" }
        "409": { description: World has no mesh asset or generation inputs changed }
        "422": { description: Bad parameters, no walkable floor, or unsupported multi-floor or restricted graph }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/notes:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    get:
      tags: [worlds]
      summary: Read notes
      description: |
        Notes pinned to the scan in the web viewer (title, location,
        description, 3D position). Returns an empty list (not 404) when the
        file does not exist yet.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "notes.schema.json" }
        "404": { description: World not found }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [worlds]
      summary: Replace notes
      description: |
        The viewer autosaves the full list about a second after each edit, so
        this is a whole-document replace. Validate unique ids and non-empty
        titles; set `updatedAt` on the file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "notes.schema.json" }
      responses:
        "200":
          description: Stored file (server sets `updatedAt`)
          content:
            application/json:
              schema: { $ref: "notes.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/measurements:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    get:
      tags: [worlds]
      summary: Read measurements
      description: Returns an empty list (not 404) when the file does not exist yet.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "measurements.schema.json" }
        "404": { description: World not found }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [worlds]
      summary: Replace measurements
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "measurements.schema.json" }
      responses:
        "200":
          description: Stored file (server sets `updatedAt`)
          content:
            application/json:
              schema: { $ref: "measurements.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/vps:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    get:
      tags: [navigation]
      summary: Niantic VPS site status
      description: |
        Combines what the volume holds (`assets.vpsMap`) with the last
        successful localization recorded for the site and, when a Lightship
        API key is configured on the backend, the location's activation state
        from Niantic. Cached for 60 s.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/vpsSiteStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The world has no `nianticSiteId` yet }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/localize:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    post:
      tags: [navigation]
      summary: Report a Niantic SDK localization fix
      description: |
        The phone calls this whenever the Lightship SDK returns a VPS
        localization. The backend:

        1. rejects the fix if `nianticSiteId` differs from the manifest (`409`);
        2. re-expresses the pose in the world frame using `alignment`;
        3. snaps it to the nearest graph node / edge;
        4. creates a session on the first call and returns its id.

        Subsequent high-rate ARKit poses go to `POST /sessions/{sessionId}/pose`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "navigation.schema.json#/$defs/localizationUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/localizationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Site id mismatch, or the world has no navigation graph }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/localize/query:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    post:
      tags: [navigation]
      summary: Upload one VPS image query (camera frame + SDK request record + resulting pose)
      description: |
        The Niantic SDK submits camera frames to VPS itself; the phone mirrors
        every `vpsLocalize` request it sees on `localizationRequestRecords`
        here, with the JPEG of the frame that was submitted and the camera pose
        at capture time expressed in the site frame (anchor⁻¹ · camera).
        Failed and rejected queries are uploaded too so the dashboard can show
        what the phone saw when localization did not work.

        The backend stores the JPEG at `worlds/{id}/localizations/{queryId}.jpg`
        (served by `GET /worlds/{id}/localizations/{queryId}.jpg`, immutable),
        prepends the record to `localizations/index.json` (capped at 50, older
        images are deleted), snaps a successful pose to the graph, and stamps
        `vps-status.json` like `/localize` does.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "navigation.schema.json#/$defs/localizationQueryUpload" }
      responses:
        "201":
          description: Stored record
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/localizationQuery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Site id mismatch }
        "413": { description: Image larger than 2 MiB }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/localizations:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    get:
      tags: [navigation]
      summary: Recent VPS image queries for the world, newest first
      description: |
        Polled by the web viewer (≈1 Hz) to draw the phone's localized pose and
        the query image on the splat. Image bytes are fetched separately from
        `GET /worlds/{id}/localizations/{queryId}.jpg` (the versioned-asset
        route; the files are write-once so they cache as immutable).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/localizationQueries" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/route:
    parameters: [{ $ref: "#/components/parameters/worldId" }]
    post:
      tags: [navigation]
      summary: Compute a route over the navigation graph
      description: |
        Dijkstra over `navigationGraph` (edge `distance` when present,
        otherwise straight-line). A free `from` position is snapped to the
        nearest edge first. Turn instructions are derived from consecutive leg
        headings; `text` is what the phone speaks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "navigation.schema.json#/$defs/routeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/routeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: World or destination node not found }
        "422": { description: Destination is unreachable from the start }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /worlds/{id}/{version}/{filename}:
    parameters:
      - { $ref: "#/components/parameters/worldId" }
      - name: version
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
      - name: filename
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
    get:
      tags: [assets]
      summary: Download an asset
      description: |
        Streams the file. Set `Content-Type` (`application/octet-stream` for
        `.spz`), `Content-Length`, `ETag` and
        `Cache-Control: public, max-age=31536000, immutable` — versions never
        change in place. `Range` support is optional; Spark streams
        sequentially.
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [assets]
      summary: Upload an asset
      description: |
        Raw bytes in the body (no multipart), `Content-Type:
        application/octet-stream`, `Content-Length` set. Stream to the volume;
        do not buffer whole files in memory. Creates the version directory if
        needed and refuses to overwrite an existing file (`409`) — the web app
        reacts to `409` by uploading to the next version and then `PATCH`ing
        `version` + `assets`. Does not touch the manifest. Accepted splat
        formats: `.spz .ply .splat .ksplat .sog`; also `.glb`, `.png`, `.jpg`,
        `.webp`, `.bin`. On any failure remove the partial file.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [path, bytes]
                properties:
                  path: { type: string, examples: ["worlds/demo-building/v2/scene.spz"] }
                  bytes: { type: integer }
                  sha256: { type: string }
        "409": { description: File already exists at this version }
        "413": { description: Larger than the configured limit (default 2 GiB) }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions:
    post:
      tags: [sessions]
      summary: Start a navigation session explicitly
      description: |
        Optional — `POST /worlds/{id}/localize` creates one implicitly. Use this
        when the destination is chosen before the first VPS fix (e.g. picked in
        the web dashboard and pushed to the phone).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, deviceId]
              properties:
                worldId: { type: string }
                deviceId: { type: string }
                destination: { type: string, description: "Destination node id." }
                accessibleOnly: { type: boolean, default: false, description: "Route and reroute without stairs / escalators (edges with `accessible: false`)." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/session" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{sessionId}:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [sessions]
      summary: Read session state
      description: Used by the web dashboard's live panel; poll or subscribe via the WebSocket.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/session" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [sessions]
      summary: End a session
      responses:
        "204": { description: Ended }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{sessionId}/destination:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    put:
      tags: [sessions]
      summary: Set or change the destination
      description: |
        Recomputes the route from the last known pose and emits a `rerouted` event. `destination` is a
        graph node id or `note:<noteId>` for a note pinned in the web viewer (the route ends on the
        walkable edge beside the note; the arrival cue says where the note is relative to the traveller).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination: { type: string }
                accessibleOnly: { type: boolean }
      responses:
        "200":
          description: Updated session with the new route
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/session" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Destination unreachable }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [sessions]
      summary: Stop guidance
      description: |
        Clears the destination and route but keeps the session and its pose stream; state becomes
        `localizing` (or stays `lost`) and a `progress` event with `speak: "Guidance stopped."` is emitted
        when guidance was active. Used by the voice assistant's `stop_navigation` tool.
      responses:
        "200":
          description: Updated session without a destination
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/session" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Session ended }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{sessionId}/pose:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [sessions]
      summary: Push an ARKit pose and get the next cue
      description: |
        Called at 5–10 Hz by the phone between VPS fixes. The backend updates
        progress along the route, detects off-route (> 3 m from the nearest
        leg → `off-route`, re-route automatically after 5 s), arrival (< 1.5 m
        from the destination) and lost tracking, and returns the `speak`
        phrase, if any, that the phone should say now. Every call also emits a
        `progress` event on the WebSocket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "navigation.schema.json#/$defs/poseUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "navigation.schema.json#/$defs/progressUpdate" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Session ended. Poses without a destination are accepted and answer `localizing`, so guidance started server-side (voice assistant) picks up the phone's stream immediately. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ws/sessions/{sessionId}:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [sessions]
      summary: Live session events (WebSocket)
      description: |
        Upgrade to a WebSocket. Authenticate with `X-API-Key` on the upgrade
        request (or `?key=` for browsers that cannot set headers — the Next.js
        app should proxy instead). The server pushes `SessionEvent` JSON
        messages (`localized`, `progress`, `rerouted`, `arrived`, `lost`,
        `ended`) and replays the latest state on connect. Clients may send
        `{"type":"ping"}`; nothing else is accepted.
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Shared secret from the `WANDER_API_KEY` Modal Secret; compared with `secrets.compare_digest`.

  parameters:
    worldId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
    sessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or wrong `X-API-Key`
      content:
        application/json:
          schema:
            type: object
            properties: { detail: { type: string, examples: ["invalid api key"] } }
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties: { detail: { type: string } }
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                oneOf:
                  - { type: string }
                  - { type: array, items: { type: object } }

  schemas:
    NavmeshParams:
      type: object
      description: Occupancy-grid settings; all metres except `floorSlopeDeg` and `seed`.
      properties:
        cell: { type: number, default: 0.15, minimum: 0.05, maximum: 1 }
        agentRadius: { type: number, default: 0.3, description: Walkable space is eroded by this }
        agentHeight: { type: number, default: 1.8, description: Solids between `stepHeight` and this height block a cell }
        stepHeight: { type: number, default: 0.25 }
        spacing: { type: number, default: 1.5, description: Waypoint lattice pitch; at least two cells }
        floorSlopeDeg: { type: number, default: 30 }
        seed: { type: integer, default: 0 }
    GraphIssue:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          enum: [node-off-floor, node-edge-of-floor, node-in-obstacle, node-height, node-clearance, edge-through-wall, edge-off-floor, edge-clearance]
        node: { type: string, description: Node issues }
        from: { type: string, description: Edge issues }
        to: { type: string }
        at: { type: array, items: { type: number }, minItems: 3, maxItems: 3, description: World-frame point mid-way through the offending cells }
        offsetMetres: { type: number, description: "`node-height` only: signed height above the floor" }
        message: { type: string }
    NavmeshProposal:
      type: object
      description: "`worlds/<id>/navmesh.json` — a mesh-derived graph awaiting review; never routed against."
      required: [schema, worldId, mesh, status, params, grid, graph, currentGraphIssues, createdAt]
      properties:
        schema: { const: wander.navmesh/v1 }
        worldId: { type: string }
        mesh: { type: string, description: Volume path of the mesh that was gridded }
        status: { const: proposed }
        params:
          allOf:
            - { $ref: "#/components/schemas/NavmeshParams" }
            - type: object
              properties: { frame: { type: string, enum: [world, splat] } }
        grid:
          type: object
          description: Top-down occupancy over XZ; `rows[z][x]` is '.' walkable, 'x' blocked or no floor, ' ' no data.
          required: [origin, cell, width, height, floorY, rows, walkableCells, floorCells]
          properties:
            origin: { type: array, items: { type: number }, minItems: 3, maxItems: 3, description: "[x, floorY, z] of the grid corner" }
            cell: { type: number }
            width: { type: integer }
            height: { type: integer }
            floorY: { type: number }
            rows: { type: array, items: { type: string } }
            walkableCells: { type: integer }
            floorCells: { type: integer }
            excludedWalkableCells: { type: integer, description: Separate walkable cells outside the main connected floor }
        graph: { $ref: "world.schema.json#/properties/navigationGraph" }
        sourceRevision: { type: string, description: Opaque quoted revision for If-Match on acceptance }
        proposalIssues:
          type: array
          items: { $ref: "#/components/schemas/GraphIssue" }
        places:
          type: array
          items:
            type: object
            required: [id, name, connected, movedMetres]
            properties:
              id: { type: string }
              name: { type: string }
              connected: { type: boolean }
              movedMetres: { type: number }
        currentGraphIssues:
          type: array
          description: The stored `navigationGraph` checked against the same grid
          items: { $ref: "#/components/schemas/GraphIssue" }
        createdAt: { type: string, format: date-time }
