name: NavigationAssistant
options:
  bundleIdPrefix: com.hackthenorth
  deploymentTarget:
    iOS: "26.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DVX8YZ9GG9
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  NSDK:
    url: https://github.com/nianticspatial/nsdk-library-xcframework
    exactVersion: 4.1.0-26051913
targets:
  NavigationAssistant:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - Services
      - path: Resources
        excludes: [LocalConfig.plist]
      - path: Resources/LocalConfig.plist
        optional: true
    dependencies:
      - package: NSDK
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nav Assistant
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: The chest phone uses the camera and LiDAR to detect obstacles and localize against the mapped building.
        NSMicrophoneUsageDescription: The voice guide listens to your questions and requests, such as "guide me to Bed 1", during a call.
        # Keeps a voice call alive if the screen locks; ARKit itself still needs the app in front.
        UIBackgroundModes: [audio]
        NSLocationWhenInUseUsageDescription: Location helps Niantic localization pick the correct mapped site.
        NSLocalNetworkUsageDescription: The four phones on the wearer talk to each other directly to share obstacle readings and buzz commands.
        NSBonjourServices: [_htn-navaid._tcp, _htn-navaid._udp]
        ITSAppUsesNonExemptEncryption: false
        # Lets Settings point the backend at a dev machine over plain http on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # wander://connect?… links from the web viewer's QR code configure the phone for a world.
        CFBundleURLTypes:
          - CFBundleURLName: com.hackthenorth.navassist.connect
            CFBundleURLSchemes: [wander]
    settings:
      base:
        # BUNDLE_ID_SUFFIX lets a second free team sign a copy for its own phone
        # (Apple won't share one bundle ID between personal teams): pass e.g. BUNDLE_ID_SUFFIX=.ae to xcodebuild.
        BUNDLE_ID_SUFFIX: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.hackthenorth.navassist$(BUNDLE_ID_SUFFIX)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  NavigationAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: NavigationAssistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NavigationAssistant.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NavigationAssistant
        BUNDLE_LOADER: $(TEST_HOST)
  NavigationAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: NavigationAssistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NavigationAssistant
schemes:
  NavigationAssistant:
    build:
      targets:
        NavigationAssistant: all
        NavigationAssistantTests: [test]
        NavigationAssistantUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NavigationAssistantTests
        - NavigationAssistantUITests
